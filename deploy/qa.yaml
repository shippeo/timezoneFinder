---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: timezonefinder-qa
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: timezonefinder
    app.kubernetes.io/env: qa
spec:
  project: default
  source:
    repoURL: https://github.com/shippeo/timezoneFinder.git
    targetRevision: sre/sreopt-299
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: timezonefinder-qa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: Service
metadata:
  name: timezonefinder
  namespace: timezonefinder-qa
  labels:
    app.kubernetes.io/name: timezonefinder
spec:
  selector:
    app.kubernetes.io/name: timezonefinder
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timezonefinder
  namespace: timezonefinder-qa
  labels:
    app.kubernetes.io/name: timezonefinder
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: timezonefinder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: timezonefinder
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: timezonefinder
          image: shippeo/timezonefinder:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: Accept
                  value: application/json
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
